apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mural.fullname" . }}-config
  labels:
    {{- include "mural.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  API_UPSTREAM: "{{ include "mural.fullname" . }}-api:{{ .Values.api.servicePort }}"
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
