{{- $password := required "Forneça postgres.password por entrada externa" .Values.postgres.password -}}
{{- $user := .Values.postgres.user | urlquery | replace "+" "%20" -}}
{{- $encodedPassword := $password | urlquery | replace "+" "%20" -}}
{{- $database := .Values.postgres.database | urlquery | replace "+" "%20" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.fullname" . }}-database
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s?sslmode=disable" $user $encodedPassword (include "mural.fullname" .) $database | b64enc | quote }}
